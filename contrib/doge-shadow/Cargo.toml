[package]
name = "doge-shadow"
version = "0.1.0"
edition = "2021"
description = "Shadow fork orchestration CLI for Dogecoin Core"
authors = ["Dogecoin Developers"]
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"
tokio = { version = "1", features = ["full"] }
tempfile = "3"
hex = "0.4"

[[bin]]
name = "doge-shadow"
path = "src/main.rs"
