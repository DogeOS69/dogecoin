# Dogecoin Testnet Node Configuration
# For shadow fork testing infrastructure

# Network
testnet=1

# Indexing (required for shadow fork testing)
txindex=1

# Server mode
server=1
rest=1

# RPC Configuration
# Bind to all interfaces inside container (firewall at host level)
rpcbind=0.0.0.0
rpcallowip=0.0.0.0/0

# RPC authentication (change these for production!)
rpcuser=shadowfork
rpcpassword=shadowfork_testnet_password

# Connection settings
maxconnections=32
timeout=30000

# Logging
printtoconsole=1
logtimestamps=1
logips=1

# Memory pool
maxmempool=300

# Don't prune - we need full blocks for shadow fork stepping
prune=0

# Useful for debugging
debug=rpc
